name: nightly-destroy

# Safety net against a forgotten environment.
# CONFIGURE: change the cron below (UTC; 05:00 UTC = 02:00 in Brasilia).
# DISABLE, any one of:
#   - set the repo variable NIGHTLY_DESTROY to "false" (Settings > Secrets and variables > Actions > Variables)
#   - disable this workflow in the Actions tab
#   - delete the schedule block
# Note: GitHub pauses scheduled workflows in a repo with no activity for 60 days; re-enable them
# in the Actions tab if that happens.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: devbox-state
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: sa-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_tailnet_dns_name: ${{ vars.TAILNET_DNS_NAME }}

jobs:
  destroy:
    if: vars.NIGHTLY_DESTROY != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform destroy -auto-approve -lock-timeout=5m || (sleep 30 && terraform destroy -auto-approve -lock-timeout=5m)
      - run: echo "### Nightly destroy finished" >> "$GITHUB_STEP_SUMMARY"
